  saved like a Compact View pick; see samples/html-output/sample-html-video.html.

  Desktop: YouTube watch URL. Mobile: Vimeo URL.
-->

  height="315"
  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
  allowfullscreen
></iframe>

  class="bynder-video-embed is-mobile"
