<!--
  splitLeftRight, from samples/bynder-field-split-left-right.json.
  Same two Bynder files as the largeHero sample, drawn in a slot about 40vw wide.

  width and height are the desktop file the profile asks Bynder for:
  targetWidth at that aspect ratio, capped so neither side passes 2000.
  They are not the CSS display size, and they are not the mobile size.
  Desktop 7:4 at targetWidth 700 is 700×400.
  Mobile 16:9 at targetWidth 354 is 354×199, from the separate mobile file.
  That 354 is below the 640 srcset step, so the mobile source has one candidate.
  src is the largest desktop file. sizes="40vw" is the display size the browser
  multiplies by the screen density when it picks a srcset candidate.

  The full-bleed example is samples/bynder-picture-large-hero.html.
-->
<picture>
  <source
    media="(max-width: 767px)"
    sizes="40vw"
    srcset="

  />
  <img
    src="https://assets.deltafaucet.com/transform/09c73413-5f93-4d0d-b159-4ddb817e06ca/AVS3-WQ2101-SS_MODEL_WATER_09?io=transform:fill,width:700,height:400&focuspoint=0.5,0.5&format=webp&quality=80"

    sizes="40vw"
    width="700"
    height="400"

    style="width:40vw;height:auto;object-position:50% 50%"
